<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Roteiro 2027 · João & Isabele</title>
<style>html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f7f8;color:#202124}.load{min-height:100vh;display:grid;place-items:center;padding:24px}.card{max-width:420px;text-align:center;background:white;border:1px solid #e5e7eb;border-radius:20px;padding:28px;box-shadow:0 8px 30px #0000000d}.spin{width:38px;height:38px;border:4px solid #eee;border-top-color:#111;border-radius:50%;margin:0 auto 18px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#6b7280}</style>
</head>
<body><div class="load"><div class="card"><div class="spin"></div><strong>Abrindo o planejador da viagem…</strong><br><small>Sincronizando a versão compartilhada</small></div></div>
<script>
(async()=>{try{
 const url='https://fbcwblrvdrzatpfewkjl.supabase.co/rest/v1/trip_planner_assets?slug=eq.viagem-2027-app&select=payload_b64&limit=1';
 const key='sb_publishable_9FHTom94uCvIO3HEKgmc8A_klQqUd2l';
 const r=await fetch(url,{cache:'no-store',headers:{apikey:key,Accept:'application/json'}});
 if(!r.ok)throw new Error('Falha ao carregar o aplicativo ('+r.status+')');
 const rows=await r.json(); if(!rows[0]?.payload_b64)throw new Error('Aplicativo não encontrado');
 const u=Uint8Array.from(atob(rows[0].payload_b64),c=>c.charCodeAt(0));
 if(!('DecompressionStream' in window))throw new Error('Este navegador precisa ser atualizado');
 const stream=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));
 const html=await new Response(stream).text();
 document.open();document.write(html);document.close();
}catch(e){console.error(e);document.body.innerHTML='<div class="load"><div class="card"><strong>Não foi possível abrir o planejador.</strong><p>'+String(e.message||e)+'</p><small>Atualize o navegador e tente novamente.</small></div></div>'}})();
</script></body></html>
